# Положите файлы: launcher-version.json, Afterlife Launcher-portable.exe, FiveM.zip
# в каталог на сервере и подключите этот location в server { ... }.
# ~2 МБ/с на одно соединение, чтобы скачивания не забивали канал игрового сервера.

location /launcher/ {
    limit_rate 2m;
    alias /var/www/afterlifedayz/launcher/;
    autoindex off;
}
